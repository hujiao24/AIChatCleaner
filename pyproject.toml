[project]
name = "ai-chat-cleaner"
version = "0.3.0"
description = "Clear local AI chat history (Cursor, VS Code Copilot, Codex, WSL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
